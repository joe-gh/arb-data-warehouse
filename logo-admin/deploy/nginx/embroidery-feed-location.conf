# Local deployment artifact for the machine product feed (/feed/*).
# Include this location block inside the embroidery.arborwear.com server block
# (/etc/nginx/sites-available/embroidery.conf), ABOVE the generic `location /`,
# after human review - this repository file does not modify the deployed host.
#
# The server block's operator IP allowlist (allow .../deny all) must NOT gate
# these endpoints: consumers are remote machines (Emblem, Shopify adapter)
# authenticated by per-consumer bearer tokens checked in the app
# (woo.feed_consumer, sha256 at rest). `allow all` here overrides the
# server-level access rules for this location only; everything else on the
# host keeps the allowlist.
location ^~ /feed/ {
    allow all;

    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Feed pages can reach a few MB at limit=5000; no buffering surprises.
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 16k;
}
