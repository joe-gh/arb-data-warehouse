# Local deployment artifact for the authenticated assistant SSE endpoint.
# Include this exact-location block in the arb-logo-admin server only after
# human review; this repository file does not modify the deployed nginx host.
location = /api/agent/chat {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
